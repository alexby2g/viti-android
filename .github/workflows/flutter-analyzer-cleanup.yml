name: Flutter analyzer cleanup

on:
  push:
    branches: [agent/flutter-clean-analyzer-20260813]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flutter-clean-analyzer-20260813
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Keep repository analyzer policy unchanged
        run: git checkout -- analysis_options.yaml
      - name: Apply targeted safety and file-picker fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/features/apps/electrofrio_app_screen.dart',
              "    final clients = await _safe('clientes');\n    if (clients.isEmpty) {",
              "    final clients = await _safe('clientes');\n    if (!mounted) return;\n    if (clients.isEmpty) {",
          )
          replace_once(
              'lib/features/apps/electrofrio_app_screen.dart',
              "    final users = await _safe('usuarios-negocio');\n    final draft = await showElectroTechnicianForm(context, users: users, initial: initial);",
              "    final users = await _safe('usuarios-negocio');\n    if (!mounted) return;\n    final draft = await showElectroTechnicianForm(context, users: users, initial: initial);",
          )
          replace_once(
              'lib/features/apps/electrofrio_app_screen.dart',
              "    final technicians = await _safe('tecnicos');\n    if (clients.isEmpty) {",
              "    final technicians = await _safe('tecnicos');\n    if (!mounted) return;\n    if (clients.isEmpty) {",
          )
          replace_once(
              'lib/features/apps/electrofrio_order_workspace.dart',
              "    try{available=await widget.repository.list('materiales');}on ApiException catch(e){if(mounted)_notice(e.message);return;}\n    final active=available.where",
              "    try{available=await widget.repository.list('materiales');}on ApiException catch(e){if(mounted)_notice(e.message);return;}\n    if(!mounted)return;\n    final active=available.where",
          )

          replace_once(
              'lib/features/apps/technical_workflow_dialogs.dart',
              "  final picked = await FilePicker.pickFiles(\n    type: FileType.custom,\n    allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp'],\n    allowMultiple: false,\n    withData: false,\n  );\n  if (picked == null || picked.files.isEmpty || picked.files.first.path == null) return null;\n\n  final file = picked.files.first;",
              "  final file = await FilePicker.pickFile(\n    type: FileType.custom,\n    allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp'],\n  );\n  if (!context.mounted) return null;\n  if (file == null || file.path == null) return null;",
          )

          replace_once(
              'lib/features/messages/message_module_screen.dart',
              "    final result = await FilePicker.pickFiles(\n      type: FileType.custom,\n      allowMultiple: false,\n      allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp', 'pdf', 'doc', 'docx', 'xls', 'xlsx', 'txt'],\n    );\n    if (result == null || result.files.isEmpty) return;\n    final file = result.files.single;",
              "    final file = await FilePicker.pickFile(\n      type: FileType.custom,\n      allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp', 'pdf', 'doc', 'docx', 'xls', 'xlsx', 'txt'],\n    );\n    if (file == null) return;",
          )

          replace_once(
              'lib/features/payments/payment_module_screen.dart',
              "    final result = await FilePicker.pickFiles(type: FileType.custom, allowMultiple: false, allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp', 'pdf']);\n    if (result == null || result.files.isEmpty) return null;\n    final file = result.files.single;",
              "    final file = await FilePicker.pickFile(type: FileType.custom, allowedExtensions: const ['jpg', 'jpeg', 'png', 'webp', 'pdf']);\n    if (file == null) return null;",
          )
          PY
      - name: Apply Dart-supported fixes
        run: dart fix --apply
      - name: Format modified Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi
      - name: Apply post-format Dart fixes
        run: dart fix --apply
      - name: Reformat modified Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi
      - name: Require clean analyzer
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Show resulting diff
        run: git diff --stat && git diff --check
      - name: Commit verified cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/flutter-analyzer-cleanup.yml
          git config user.name "alexby2g"
          git config user.email "287088731+alexby2g@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Limpiar advertencias del analizador Flutter"
          git push origin HEAD:agent/flutter-clean-analyzer-20260813
